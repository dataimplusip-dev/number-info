<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-time Phone Number Inspector</title>
  <!-- Google libphonenumber লাইব্রেরি (সরাসরি ব্রাউজারে কাজ করে) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/libphonenumber-js/1.10.44/libphonenumber-js.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 50px 15px;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      text-align: center;
      color: #58a6ff;
      margin-bottom: 25px;
      font-size: 1.6rem;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background-color: #161b22;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    button {
      padding: 14px 22px;
      border-radius: 8px;
      border: none;
      background-color: #238636;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover {
      background-color: #2ea043;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      display: none;
      margin-top: 15px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #21262d;
      font-size: 14px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #8b949e;
    }
    .info-value {
      color: #58a6ff;
      font-weight: 600;
      text-align: right;
    }
    .error {
      color: #f85149;
      text-align: center;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📞 মোবাইল নম্বর ইনফো লুকআপ</h1>
    
    <div class="search-box">
      <input type="text" id="phoneInput" placeholder="কান্ট্রি কোডসহ দিন (যেমন: +88017... বা +9198...)" />
      <button onclick="checkNumber()">Search</button>
    </div>

    <div class="error" id="error"></div>

    <div class="card" id="resultCard">
      <div class="info-row">
        <span class="info-label">নম্বর ফরম্যাট:</span>
        <span class="info-value" id="resIntl">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">স্ট্যাটাস:</span>
        <span class="info-value" id="resStatus">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">দেশ (Country):</span>
        <span class="info-value" id="resCountry">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">লাইনের ধরন:</span>
        <span class="info-value" id="resType">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">ন্যাশনাল নম্বর:</span>
        <span class="info-value" id="resNational">-</span>
      </div>
    </div>
  </div>

  <script>
    function checkNumber() {
      let raw = document.getElementById('phoneInput').value.trim();
      const card = document.getElementById('resultCard');
      const err = document.getElementById('error');

      if (!raw) {
        alert("দয়া করে একটি নম্বর লিখুন!");
        return;
      }

      card.style.display = "none";
      err.style.display = "none";

      if (!raw.startsWith('+')) {
        raw = '+' + raw;
      }

      try {
        const phoneNumber = libphonenumber.parsePhoneNumber(raw);

        if (phoneNumber) {
          const isValid = phoneNumber.isValid();
          document.getElementById('resIntl').textContent = phoneNumber.formatInternational();
          document.getElementById('resStatus').textContent = isValid ? "সঠিক ও সক্রিয় (Valid)" : "ভুয়া বা নিষ্ক্রিয় নম্বর (Invalid)";
          document.getElementById('resCountry').textContent = phoneNumber.country || "অজানা";
          document.getElementById('resType').textContent = phoneNumber.getType() || "Mobile";
          document.getElementById('resNational').textContent = phoneNumber.formatNational();

          card.style.display = "block";
        } else {
          err.textContent = "নম্বরটি সঠিক নয়! কান্ট্রি কোডসহ দিন।";
          err.style.display = "block";
        }
      } catch (e) {
        err.textContent = "ভুল নম্বর ফরম্যাট! (যেমন: +8801752251425 বা +919876543210 দিন)";
        err.style.display = "block";
      }
    }
  </script>
</body>
</html>
