<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Number Info Lookup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 15px;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      color: #58a6ff;
      margin-bottom: 25px;
      font-size: 1.6rem;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background-color: #21262d;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    button {
      padding: 14px 22px;
      border-radius: 8px;
      border: none;
      background-color: #238636;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover {
      background-color: #2ea043;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      display: none;
      margin-top: 15px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #21262d;
      font-size: 14px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #8b949e;
    }
    .info-value {
      color: #58a6ff;
      font-weight: 600;
      text-align: right;
    }
    .loader {
      display: none;
      text-align: center;
      color: #58a6ff;
      margin: 15px 0;
    }
    .error {
      color: #f85149;
      text-align: center;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📞 মোবাইল নম্বর সার্চ ইঞ্জিন</h1>
    
    <div class="search-box">
      <input type="text" id="phoneInput" placeholder="কান্ট্রি কোডসহ নম্বর দিন (যেমন: +88017...)" />
      <button onclick="lookupNumber()">Search</button>
    </div>

    <div class="loader" id="loader">তথ্য খোঁজা হচ্ছে, দয়া করে অপেক্ষা করুন...</div>
    <div class="error" id="error"></div>

    <div class="card" id="resultCard">
      <div class="info-row">
        <span class="info-label">নম্বর:</span>
        <span class="info-value" id="resNumber">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">স্ট্যাটাস:</span>
        <span class="info-value" id="resValid">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">দেশ:</span>
        <span class="info-value" id="resCountry">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">লোকেশন / রিজিয়ন:</span>
        <span class="info-value" id="resLocation">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">অপারেটর (Carrier):</span>
        <span class="info-value" id="resCarrier">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">লাইনের ধরন:</span>
        <span class="info-value" id="resLineType">-</span>
      </div>
    </div>
  </div>

  <script>
    async function lookupNumber() {
      let input = document.getElementById('phoneInput').value.trim();
      const card = document.getElementById('resultCard');
      const loader = document.getElementById('loader');
      const error = document.getElementById('error');

      if (!input || input.length < 8) {
        alert("দয়া করে সঠিক মোবাইল নম্বর লিখুন (যেমন: +8801752251425)");
        return;
      }

      // নম্বর থেকে স্পেস বা ড্যাশ বাদ দেওয়া
      input = input.replace(/[\s\-]/g, '');
      if (!input.startsWith('+')) {
        input = '+' + input;
      }

      card.style.display = "none";
      error.style.display = "none";
      loader.style.display = "block";

      try {
        // Open Carrier & Number Analysis Lookup API
        const response = await fetch(`https://phonevalidation.abstractapi.com/v1/?api_key=000c01cb3c1341cfa2863777a8bfae34&phone=${encodeURIComponent(input)}`);
        
        if (!response.ok) {
          throw new Error('Network error');
        }

        const data = await response.json();
        loader.style.display = "none";

        if (data && data.valid !== undefined) {
          document.getElementById('resNumber').textContent = data.format?.international || input;
          document.getElementById('resValid').textContent = data.valid ? "সঠিক ও সক্রিয় (Valid)" : "ভুয়া নম্বর (Invalid)";
          document.getElementById('resCountry').textContent = `${data.country?.name || 'N/A'} (${data.country?.code || ''})`;
          document.getElementById('resLocation').textContent = data.location || data.country?.name || 'N/A';
          document.getElementById('resCarrier').textContent = data.carrier || 'N/A';
          document.getElementById('resLineType').textContent = data.type || 'Mobile';

          card.style.display = "block";
        } else {
          error.textContent = "এই নম্বরের কোনো তথ্য পাওয়া যায়নি!";
          error.style.display = "block";
        }
      } catch (err) {
        loader.style.display = "none";
        error.textContent = "তথ্য লোড করতে সমস্যা হয়েছে! কিছুক্ষণ পর আবার চেষ্টা করুন।";
        error.style.display = "block";
      }
    }
  </script>
</body>
</html>
