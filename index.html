<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Info Lookup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 15px;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      color: #58a6ff;
      margin-bottom: 25px;
      font-size: 1.6rem;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background-color: #21262d;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    button {
      padding: 14px 22px;
      border-radius: 8px;
      border: none;
      background-color: #238636;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover {
      background-color: #2ea043;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      display: none;
      margin-top: 15px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #21262d;
      font-size: 14px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #8b949e;
    }
    .info-value {
      color: #58a6ff;
      font-weight: 600;
      text-align: right;
    }
    .loader {
      display: none;
      text-align: center;
      color: #58a6ff;
      margin: 15px 0;
    }
    .error {
      color: #f85149;
      text-align: center;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📞 মোবাইল নম্বর সার্চ ইঞ্জিন</h1>
    
    <div class="search-box">
      <input type="text" id="phoneInput" placeholder="১০ ডিজিটের নম্বর দিন (যেমন: 9876543210)" />
      <button onclick="lookupNumber()">Search</button>
    </div>

    <div class="loader" id="loader">তথ্য খোঁজা হচ্ছে, দয়া করে অপেক্ষা করুন...</div>
    <div class="error" id="error"></div>

    <div class="card" id="resultCard">
      <div class="info-row">
        <span class="info-label">নম্বর:</span>
        <span class="info-value" id="resNumber">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">গ্রাহকের নাম:</span>
        <span class="info-value" id="resName">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">সিম অপারেটর:</span>
        <span class="info-value" id="resCarrier">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">ঠিকানা / সার্কেল:</span>
        <span class="info-value" id="resCircle">-</span>
      </div>
    </div>
  </div>

  <script>
    async function lookupNumber() {
      const input = document.getElementById('phoneInput').value.trim();
      const card = document.getElementById('resultCard');
      const loader = document.getElementById('loader');
      const error = document.getElementById('error');

      if (!input || input.length < 10) {
        alert("দয়া করে সঠিক মোবাইল নম্বর লিখুন!");
        return;
      }

      card.style.display = "none";
      error.style.display = "none";
      loader.style.display = "block";

      try {
        // Truecaller / Public API Call
        const response = await fetch(`https://api-check.vercel.app/api/check?num=${input}`);
        const data = await response.json();

        loader.style.display = "none";

        if (data && (data.name || data.carrier || data.data)) {
          const info = data.data || data;
          document.getElementById('resNumber').textContent = input;
          document.getElementById('resName').textContent = info.name || 'তথ্য নেই';
          document.getElementById('resCarrier').textContent = info.carrier || 'তথ্য নেই';
          document.getElementById('resCircle').textContent = info.circle || info.address || 'তথ্য নেই';

          card.style.display = "block";
        } else {
          error.textContent = "এই নম্বরের কোনো তথ্য পাওয়া যায়নি!";
          error.style.display = "block";
        }
      } catch (err) {
        loader.style.display = "none";
        error.textContent = "সার্ভার এরর! API সাময়িক বন্ধ থাকতে পারে।";
        error.style.display = "block";
      }
    }
  </script>
</body>
</html>
